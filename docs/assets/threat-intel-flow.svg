<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="702" viewBox="0 0 1262 702" role="img" aria-labelledby="threat-intel-flow-title threat-intel-flow-desc"><title id="threat-intel-flow-title">Live threat intelligence: what the repo deploys, against today's advisories</title><desc id="threat-intel-flow-desc">Flow of the live threat-intelligence step. The audited repos' version pins (Dockerfiles, compose, Kubernetes and Helm, version files, CI setup steps, serverless runtimes, framework lockfile entries) are read by platform_inventory.py with no network; it records each component's version, precision, context and exposure signals in platform.json. threat_intel.py runs in the background and matches that inventory against global feeds (CISA KEV, NVD CVE API 2.0, FIRST EPSS, endoflife.date) and Japanese feeds (IPA, JPCERT/CC, JVN, JVN iPedia), sending only product names and versions. A failed or suspended feed becomes a stated gap in the report, never a pass. The result, intel.json and intel.md, sorts components into act-now, review and update. The supply-chain-infra lane, or the lead at Quick depth, triages it with severity floors, and the report's section 2 lists platform versions, advisory ids, the feed date and feed gaps; the validator warns when a known-exploited CVE is in no finding.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1260" height="700" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">Live threat intelligence: what the repo deploys, against today's advisories</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">No incident has to be named. Every audit matches the versions it finds against public feeds, global and Japanese.</text></g></g></g><g><g><rect x="30" y="110" width="240" height="170" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="137">The audited repos</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="159">Dockerfile FROM, ARG defaults</text><text x="40" y="173">compose, Kubernetes, Helm</text><text x="40" y="187">.tool-versions, .nvmrc, ...</text><text x="40" y="201">CI setup steps</text><text x="40" y="215">serverless runtimes</text><text x="40" y="229">framework lockfile entries</text></g></g></g><g><g><rect x="320" y="110" width="270" height="170" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="330" y="137">platform_inventory.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="330" y="159">no network, seconds, writes platform.json</text><text x="330" y="173">version with its pin's path:line</text><text x="330" y="187">precision: exact, minor, range,</text><text x="330" y="201">floating, distro, managed</text><text x="330" y="215">context: deploy, build, ci, dev</text><text x="330" y="229">exposure and hardening signals</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="640" y="110" width="270" height="170" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2.5" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="650" y="137">threat_intel.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="650" y="159">background, 10-90 s, all repos</text><text x="650" y="173">sends product + version only</text><text x="650" y="187">fixed host allowlist</text><text x="650" y="201">cached with a TTL per feed</text><text x="650" y="215">feed text sanitised, treated</text><text x="650" y="229">as data, never instructions</text></g></g></g><g><g><rect x="970" y="96" width="260" height="130" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="980" y="123">Global feeds</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="980" y="145">CISA KEV (exploited, ransomware)</text><text x="980" y="159">NVD CVE API 2.0 (CPE + version)</text><text x="980" y="173">FIRST EPSS (30-day likelihood)</text><text x="980" y="187">endoflife.date (support cycles)</text></g></g></g><g><g><rect x="970" y="246" width="260" height="130" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="980" y="273">Japan feeds</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="980" y="295">IPA security alerts</text><text x="980" y="309">JPCERT/CC alerts</text><text x="980" y="323">JVN (JVN#, JVNVU#)</text><text x="980" y="337">JVN iPedia new entries</text></g></g></g><g><g><rect x="970" y="440" width="260" height="130" rx="5" ry="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" style="fill: rgb(254, 226, 226); stroke: rgb(185, 28, 28);"/></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(127, 29, 29);"><text x="980" y="467">Feed failed or suspended</text></g></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(127, 29, 29);"><text x="980" y="489">stated as a coverage gap</text><text x="980" y="503">in the report, never a pass</text><text x="980" y="517">--offline: cache only,</text><text x="980" y="531">also stated</text></g></g></g><g><g><rect x="640" y="440" width="270" height="130" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="650" y="467">intel.json + intel.md</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="650" y="489">act-now: KEV or national alert</text><text x="650" y="503">on the pinned version</text><text x="650" y="517">review: EOL, unmatched alert, critical</text><text x="650" y="531">update: behind the latest patch</text></g></g></g><g><g><rect x="320" y="440" width="270" height="130" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="330" y="467">Triage (supply-chain-infra lane)</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="330" y="489">the lead at Quick depth</text><text x="330" y="503">severity floors: KEV on an exact,</text><text x="330" y="517">internet-facing deploy pin = P0/P1</text><text x="330" y="531">one finding per remediation:</text><text x="330" y="545">upgrade, rebuild, redeploy</text></g></g></g><g><g><rect x="30" y="440" width="240" height="130" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="467">Report, section 2</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="489">platform versions and threat</text><text x="40" y="503">intelligence, advisory ids,</text><text x="40" y="517">feed date and feed gaps</text><text x="40" y="531">validator warns on a KEV CVE</text><text x="40" y="545">that no finding covers</text></g></g></g><g><g><path d="M 270 195 L 308.76 195" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 317.76 195 L 308.76 199.5 L 308.76 190.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 590 195 L 628.76 195" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 637.76 195 L 628.76 199.5 L 628.76 190.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 970 161 L 950 161 Q 940 161 940 156.75 L 940 154.63 Q 940 152.5 930.62 152.5 L 921.24 152.5" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 912.24 152.5 L 921.24 148 L 921.24 157 Z" fill="#b45309" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g><g><path d="M 970 311 L 950 311 Q 940 311 940 301 L 940 256 Q 940 246 930.62 246 L 921.24 246" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 912.24 246 L 921.24 241.5 L 921.24 250.5 Z" fill="#b45309" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g><g><path d="M 1100 376 L 1100 428.76" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 1100 437.76 L 1095.5 428.76 L 1104.5 428.76 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(51, 65, 85);"><rect fill="#F8FAFC" stroke="none" x="1072" y="402" width="57" height="15" stroke-width="0" style="fill: rgb(248, 250, 252);"/><text x="1100" y="413">feed down</text></g></g></g><g><g><path d="M 970 505 L 921.24 505" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 912.24 505 L 921.24 500.5 L 921.24 509.5 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g><g><g><path d="M 775 280 L 775 428.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 775 437.76 L 770.5 428.76 L 779.5 428.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 640 505 L 601.24 505" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 592.24 505 L 601.24 500.5 L 601.24 509.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 320 505 L 281.24 505" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 272.24 505 L 281.24 500.5 L 281.24 509.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(71, 85, 105);"><text x="30" y="617">Precision decides what a match means: an exact deploy pin is evidence, a floating tag (php:8.3-fpm, node:20) is whatever was built last,</text><text x="30" y="633">a distro package may carry a backport and needs a runtime check, a managed runtime is patched by the provider. Advisories change daily,</text><text x="30" y="649">so the report states the feed date and is true as of that date only.</text></g></g></g></g></g></g></svg>
