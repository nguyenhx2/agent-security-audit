<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="774" viewBox="0 0 1202 774" role="img" aria-labelledby="model-allocation-title model-allocation-desc"><title id="model-allocation-title">Which model does what: allocation per depth and subagent</title><desc id="model-allocation-desc">Model allocation per audit depth. Columns Quick, Standard and Deep; rows per role. Recon: lead inline at Quick; recon-mapper subagent Sonnet medium at Standard and Deep. Design lane groups (authz-logic, sensitive-data, ai-agentic): lead inline at Quick, Sonnet high at Standard, Opus high at Deep. Other lane groups (injection-dataflow, mobile, supply-chain-infra, perf-quality): lead inline at Quick, Sonnet medium at Standard, Sonnet high at Deep. Verifier: lead re-checks P0 and P1 at Quick, finding-verifier Sonnet high on P0 and P1 at Standard, Opus high on P0 to P2 at Deep. Translator, only with two or more report languages: report-translator Sonnet medium. Below: the deterministic scripts that do discovery without a model, and the rules every subagent runs under: read-only tools, a turn cap, CLAUDE.md not loaded, and Haiku not used for security judgement.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="772" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">Which model does what: allocation per depth and subagent</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">Scripts do discovery, so model turns go to judgement. Each call passes model and effort explicitly.</text></g></g></g><g><g><rect x="30" y="100" width="270" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" style="fill: rgb(22, 54, 92); stroke: rgb(22, 54, 92);"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="165" y="129">Role</text></g></g></g><g><g><rect x="310" y="100" width="280" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" style="fill: rgb(22, 54, 92); stroke: rgb(22, 54, 92);"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="450" y="129">Quick</text></g></g></g><g><g><rect x="600" y="100" width="280" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" style="fill: rgb(22, 54, 92); stroke: rgb(22, 54, 92);"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="740" y="129">Standard</text></g></g></g><g><g><rect x="890" y="100" width="280" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" style="fill: rgb(22, 54, 92); stroke: rgb(22, 54, 92);"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="1030" y="129">Deep (default)</text></g></g></g><g><g><rect x="30" y="156" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="183">Recon</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="205">attack surface, abuse cases,</text><text x="40" y="219">hypotheses (max 60 turns)</text></g></g></g><g><g><rect x="310" y="156" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="183">lead, inline</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="205">starts from routes.md</text><text x="320" y="219">and platform.md</text></g></g></g><g><g><rect x="600" y="156" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="183">recon-mapper</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="205">Sonnet / medium</text><text x="610" y="219">one per repo</text></g></g></g><g><g><rect x="890" y="156" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="900" y="183">recon-mapper</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="900" y="205">Sonnet / medium</text><text x="900" y="219">one per repo</text></g></g></g><g><g><rect x="30" y="250" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="277">Design lanes</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="299">authz-logic, sensitive-data,</text><text x="40" y="313">ai-agentic (max 120 turns)</text></g></g></g><g><g><rect x="310" y="250" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="277">lead, inline</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="299">up to 3 lanes in all,</text><text x="320" y="313">the riskiest first</text></g></g></g><g><g><rect x="600" y="250" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="277">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="299">Sonnet / high</text><text x="610" y="313">groups in parallel</text></g></g></g><g><g><rect x="890" y="250" width="280" height="84" rx="5" ry="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(15, 118, 110); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="900" y="277">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#ECFEFF" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(236, 254, 255);"><text x="900" y="299">Opus / high</text><text x="900" y="313">multi-file reasoning</text></g></g></g><g><g><rect x="30" y="344" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="371">Other lanes</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="393">injection-dataflow, mobile,</text><text x="40" y="407">supply-chain-infra, perf-quality</text></g></g></g><g><g><rect x="310" y="344" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="371">lead, inline</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="393">the rest are listed</text><text x="320" y="407">as coverage gaps</text></g></g></g><g><g><rect x="600" y="344" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="371">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="393">Sonnet / medium</text><text x="610" y="407">well-scoped, SAST-led</text></g></g></g><g><g><rect x="890" y="344" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="900" y="371">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="900" y="393">Sonnet / high</text><text x="900" y="407">groups in parallel</text></g></g></g><g><g><rect x="30" y="438" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="465">Verifier</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="487">tries to refute each candidate</text><text x="40" y="501">(max 100 turns)</text></g></g></g><g><g><rect x="310" y="438" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="465">lead re-checks P0/P1</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="487">four refutation</text><text x="320" y="501">questions</text></g></g></g><g><g><rect x="600" y="438" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="465">finding-verifier</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="487">Sonnet / high</text><text x="610" y="501">on P0 and P1</text></g></g></g><g><g><rect x="890" y="438" width="280" height="84" rx="5" ry="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(15, 118, 110); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="900" y="465">finding-verifier</text></g></g></g><g><g></g><g><g fill="#ECFEFF" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(236, 254, 255);"><text x="900" y="487">Opus / high</text><text x="900" y="501">on P0 to P2</text></g></g></g><g><g><rect x="30" y="532" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="559">Translator</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="581">2+ report languages only</text><text x="40" y="595">(max 20 turns)</text></g></g></g><g><g><rect x="310" y="532" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="320" y="559">report-translator</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="320" y="581">Sonnet / medium if the Agent</text><text x="320" y="595">tool exists, else inline</text></g></g></g><g><g><rect x="600" y="532" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="559">report-translator</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="581">Sonnet / medium</text><text x="610" y="595">one per extra language</text></g></g></g><g><g><rect x="890" y="532" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="900" y="559">report-translator</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="900" y="581">Sonnet / medium</text><text x="900" y="595">one per extra language</text></g></g></g><g><g><rect x="30" y="632" width="560" height="116" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="659">Discovery without a model</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="681">detect_stack, platform_inventory, threat_intel, repo_digest,</text><text x="40" y="695">route_map, agent_config_audit, sensitive_sweep, run_scanners,</text><text x="40" y="709">normalize_findings, lane_pack, collect_lanes, new_finding,</text><text x="40" y="723">build_report, validate_findings, render_html, render_xlsx</text></g></g></g><g><g><rect x="600" y="632" width="570" height="116" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="610" y="659">Every subagent</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="610" y="681">read-only tools: no Edit, no Agent; writes only its out file</text><text x="610" y="695">maxTurns cap; CLAUDE.md not loaded (omitClaudeMd)</text><text x="610" y="709">lane groups pack by repo size: 3, about 5, or one per lane</text><text x="610" y="723">Haiku is not used for security judgement</text></g></g></g></g></g></g></svg>
