<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="822" viewBox="0 0 1262 822" role="img" aria-labelledby="scanner-update-flow-title scanner-update-flow-desc"><title id="scanner-update-flow-title">スキャナの更新：毎週確認し、検証し、レビューを経て取り込む</title><desc id="scanner-update-flow-desc">スキャナのピンを毎週更新する流れ。毎週月曜 02:17 UTC、または手動実行で update-pins ワークフローが update_pins.py --check を実行し、Docker Hub と GHCR に匿名で問い合わせて、スキャナごとに最新の安定タグとマルチアーキテクチャのイメージインデックスのダイジェストを取得する。タグを提案するのは公開から 7 日たってからで、ダウングレードはしない。exit 0 ならすべてのピンが最新で、実行は静かに終わる。更新がある場合は smoke_scanners.py が各候補イメージを、スキャナごとに欠陥を 1 つ仕込んだフィクスチャで実行し（8 種）、今もその欠陥を検出できることを確かめる。このジョブは読み取りトークンしか持たないため、新しいイメージが書き込みトークンに触れることはない。続いて update_pins.py --write が両エディションのピンを更新し、ゲート（両方の selftest、オフラインの eval、エディションの一致、プラグインのマニフェスト、数値、バージョン）を実行する。結果は bot/scanner-pins からのプルリクエスト 1 件で、ラベルは scanner-pins、本文にリリースノートのリンク、CHANGELOG の下書き、スモークテストの結果表を載せ、CI は 3 つの OS で動く。メンテナがレビューして手でマージし、自動でマージされることはない。新しいピンは z リリースで届く。照会、スモークテスト、ゲート、プルリクエストの作成のどれかが失敗すると、Issue「update-pins failed」を 1 件作成し、以後の失敗はコメントで追記し、次に成功した実行が閉じる。監査の実行中はピンが動かない。イメージはダイジェストで固定され、Phase 8 の再スキャンも同じルールを使う。run_scanners.py --check-updates は新しいバージョンを報告するだけで、pull もピンの変更もしない。--pin を使えば 1 つのバージョンを意図的に試せる。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1260" height="820" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">スキャナの更新：毎週確認し、検証し、レビューを経て取り込む</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">安全と最新を両立します。ピンは毎週確認し、新しいバージョンはクールダウン、スモークテスト、人のレビューを経て初めて切り替わります。</text></g></g></g><g><g><rect x="30" y="110" width="200" height="110" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="40" y="137">起動</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="159">毎週 月曜 02:17 UTC</text><text x="40" y="173">または手動実行</text><text x="40" y="187">既定以外のブランチでは</text><text x="40" y="201">ドライラン（PR なし）</text></g></g></g><g><g><rect x="270" y="110" width="280" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="280" y="137">update_pins.py --check</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="280" y="159">スキャナごとに最新の安定タグと</text><text x="280" y="173">マルチアーキのインデックスの</text><text x="280" y="187">ダイジェストを取得</text><text x="280" y="201">公開から 7 日待つ（クールダウン）</text><text x="280" y="215">ダウングレードはしない</text><text x="280" y="229">exit 10：提案する更新あり</text></g></g></g><g><g><rect x="590" y="110" width="300" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="137">smoke_scanners.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="600" y="159">各候補イメージ（8 種）を、</text><text x="600" y="173">スキャナごとに欠陥を 1 つ</text><text x="600" y="187">仕込んだフィクスチャで実行し、</text><text x="600" y="201">今も検出できることを確かめる</text><text x="600" y="215">読み取り専用のジョブで実行：</text><text x="600" y="229">書き込みトークンは渡さない</text></g></g></g><g><g><rect x="930" y="110" width="300" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="940" y="137">update_pins.py --write + ゲート</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="940" y="159">ピンを更新：両エディション、</text><text x="940" y="173">README、インストール手順</text><text x="940" y="187">ゲート：両方の selftest、eval、</text><text x="940" y="201">エディションの一致、マニフェスト、</text><text x="940" y="215">数値、バージョン</text></g></g></g><g><g><rect x="30" y="300" width="200" height="140" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="40" y="327">exit 0：すべて最新</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="349">成功で静かに終わり、</text><text x="40" y="363">後続の処理は動かない</text></g></g></g><g><g><rect x="270" y="300" width="230" height="140" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="280" y="327">Docker Hub、GHCR</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="280" y="349">匿名の Registry API v2</text><text x="280" y="363">GitHub リリース：ノート、日付</text><text x="280" y="377">応答は信頼しないデータとして</text><text x="280" y="391">厳密なパターンで照合</text></g></g></g><g><g><rect x="590" y="300" width="300" height="140" rx="5" ry="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" style="fill: rgb(254, 226, 226); stroke: rgb(185, 28, 28);"/></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(127, 29, 29);"><text x="600" y="327">Issue「update-pins failed」</text></g></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(127, 29, 29);"><text x="600" y="349">照会、スモークテスト、ゲート、</text><text x="600" y="363">PR 作成のどれかが失敗したら</text><text x="600" y="377">Issue を 1 件（ラベル scanner-pins）</text><text x="600" y="391">以後の失敗はコメントで追記</text><text x="600" y="405">次に成功すると閉じる</text><text x="600" y="419">マージはしない</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="270" y="480" width="280" height="140" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2.5" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="280" y="507">z リリース</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="280" y="529">バージョンを上げ、下書きから</text><text x="280" y="543">両エディションの CHANGELOG</text><text x="280" y="557">マージしたピンは、この</text><text x="280" y="571">リリースで初めて利用者に届く</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="590" y="480" width="300" height="140" rx="5" ry="5" fill="#f1f5f9" stroke="#475569" stroke-width="2.5" style="fill: rgb(241, 245, 249); stroke: rgb(71, 85, 105);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="507">メンテナがレビュー</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="600" y="529">リリースノートと</text><text x="600" y="543">スモークテストの結果表を</text><text x="600" y="557">読んで、手でマージする</text></g></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="606">自動マージは一切しない</text></g></g></g><g><g><rect x="930" y="480" width="300" height="140" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="940" y="507">プルリクエスト 1 件</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="940" y="529">ブランチ bot/scanner-pins</text><text x="940" y="543">ラベル scanner-pins</text><text x="940" y="557">リリースノートのリンク、</text><text x="940" y="571">CHANGELOG の下書き、</text><text x="940" y="585">スモークテストの結果表</text><text x="940" y="599">CI は 3 つの OS で実行</text></g></g></g><g><g><rect x="30" y="660" width="1200" height="130" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="45" y="687">監査の実行中：ピンが勝手に動くことはない</text></g></g></g><g><g><rect x="45" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="55" y="725">ダイジェストで固定</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="55" y="747">タグ + sha256 ダイジェスト</text><text x="55" y="761">Phase 8 の再スキャンも同じルールで実行</text></g></g></g><g><g><rect x="440" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="450" y="725">run_scanners.py --check-updates</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="450" y="747">新しいバージョンを報告するだけ。</text><text x="450" y="761">pull もピンの変更もしない</text></g></g></g><g><g><rect x="835" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="845" y="725">--pin tool=image:tag@sha256:...</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="845" y="747">1 つのバージョンを意図的に、</text><text x="845" y="761">その実行だけで試す</text></g></g></g><g><g><path d="M 230 165 L 258.76 165" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 267.76 165 L 258.76 169.5 L 258.76 160.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 550 185 L 578.76 185" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 587.76 185 L 578.76 189.5 L 578.76 180.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 890 185 L 918.76 185" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 927.76 185 L 918.76 189.5 L 918.76 180.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 385 300 L 385 271.24" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 385 262.24 L 389.5 271.24 L 380.5 271.24 Z" fill="#b45309" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g><g><path d="M 270 237.5 L 140 237.5 Q 130 237.5 130 247.5 L 130 288.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 130 297.76 L 125.5 288.76 L 134.5 288.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(51, 65, 85);"><rect fill="#F8FAFC" stroke="none" x="154" y="231" width="31" height="15" stroke-width="0" style="fill: rgb(248, 250, 252);"/><text x="169" y="242.5">exit 0</text></g></g></g><g><g><path d="M 1080 260 L 1080 468.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 1080 477.76 L 1075.5 468.76 L 1084.5 468.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 930 550 L 901.24 550" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 892.24 550 L 901.24 545.5 L 901.24 554.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 590 550 L 561.24 550" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 552.24 550 L 561.24 545.5 L 561.24 554.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 410 620 L 410.03 648.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 410.04 657.76 L 405.53 648.77 L 414.53 648.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 522 260 L 522 360 Q 522 370 532 370 L 578.76 370" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 587.76 370 L 578.76 374.5 L 578.76 365.5 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g><g><g><path d="M 740 260 L 740 288.76" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 740 297.76 L 735.5 288.76 L 744.5 288.76 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g><g><g><path d="M 1005 260 L 1005 332 Q 1005 342 995 342 L 901.24 342" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 892.24 342 L 901.24 337.5 L 901.24 346.5 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g><g><g><path d="M 960 480 L 960 422 Q 960 412 950 412 L 901.24 412" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 892.24 412 L 901.24 407.5 L 901.24 416.5 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g></g></g></g></svg>
