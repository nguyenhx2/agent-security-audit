<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="863" viewBox="0 0 1202 863" role="img" aria-labelledby="coverage-map-title coverage-map-desc"><title id="coverage-map-title">確認する範囲：技術領域と業種</title><desc id="coverage-map-desc">対象範囲の図。左は 7 つの技術領域と、版付きの基準。Web と API（OWASP Top 10:2025、ASVS 5.0.0、API Security Top 10 2023、CWE Top 25 2025、IPA 安全なウェブサイトの作り方）、モバイル（MASVS 2.1.0、MASTG 2.0.0、Mobile Top 10 2024）、クラウドと IaC（CIS AWS、Azure、GCP、Kubernetes、Docker、OWASP Kubernetes Top 10 2025）、CI/CD とサプライチェーン（OWASP CI/CD Top 10、SLSA v1.2、SSDF v1.1、Non-Human Identities Top 10 2025、ライブアドバイザリ）、AI・LLM・エージェント・MCP（LLM Top 10 2026、Agentic Top 10 2026、MCP Top 10 beta、AISVS 1.01）と AI コーディングエージェントの設定、保存データと決済（PCI DSS v4.0.1）、プライバシー（GDPR、個人情報保護法、ベトナム PDPL、CCPA、HIPAA、EU CRA、EU AI Act）。右は日本、米国、EU、ベトナムの規則を持つ 6 つの業種モジュール：医療、金融と暗号資産、EC、公共、教育、IoT・OT・車両。下段：コードから検出する 9 つの業種シグナルを 6 つのモジュールに対応付け、ユーザーが申告した業種はコードに現れなくても追加する。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="861" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">確認する範囲：技術領域と業種</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">モジュールはコードから読み取れる内容と、ユーザーの申告から選びます。引用は必ず基準名 + 版 + 要件 ID です。</text></g></g></g><g><g></g><g><g fill="#16365C" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(22, 54, 92);"><text x="30" y="118">技術領域</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(120, 53, 15);"><text x="620" y="118">業種（日本、米国、EU、ベトナムの規則）</text></g></g></g><g><g><rect x="30" y="130" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="157">Web と API</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="179">OWASP Top 10:2025、ASVS 5.0.0、API Security Top 10 2023、</text><text x="40" y="193">CWE Top 25 2025、IPA 安全なウェブサイトの作り方（改訂第 7 版）</text></g></g></g><g><g><rect x="30" y="216" width="560" height="57" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="243">モバイル</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="265">OWASP MASVS 2.1.0、MASTG 2.0.0、Mobile Top 10 2024</text></g></g></g><g><g><rect x="30" y="285" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="312">クラウドと IaC</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="334">CIS AWS v7.1.0、Azure v6.0.0、GCP v5.0.0、Kubernetes、Docker、</text><text x="40" y="348">OWASP Kubernetes Top 10 2025、露出と被害範囲</text></g></g></g><g><g><rect x="30" y="371" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="398">CI/CD とサプライチェーン</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="420">OWASP Top 10 CI/CD Security Risks、SLSA v1.2、SSDF v1.1、</text><text x="40" y="434">Non-Human Identities Top 10 2025、ランタイムとライブ勧告</text></g></g></g><g><g><rect x="30" y="457" width="560" height="91" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="484">AI・LLM・エージェント・MCP</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="506">LLM Top 10 2026、Agentic Top 10 2026、MCP Top 10（beta）、</text><text x="40" y="520">AISVS 1.01。AI コーディングエージェントの設定：Claude Code、</text><text x="40" y="534">Cursor、Copilot、Codex、Gemini など（権限、フック、MCP）</text></g></g></g><g><g><rect x="30" y="560" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="587">保存データと決済</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="609">PCI DSS v4.0.1、保存禁止のデータと読めなくすべきデータ、</text><text x="40" y="623">コード、ログ、ダンプ、ノートブック内のカード・個人情報・秘密</text></g></g></g><g><g><rect x="30" y="646" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="673">プライバシー</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="695">GDPR、個人情報保護法と番号法、ベトナム PDPL、</text><text x="40" y="709">CCPA、HIPAA、EU CRA、EU AI Act</text></g></g></g><g><g><rect x="620" y="130" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="157">医療</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="179">日本：厚労省ガイドライン 7.0、総務省・経産省ガイドライン 2.0</text><text x="630" y="193">米国：HIPAA、EU：GDPR 第 9 条、ベトナム：PDPL</text></g></g></g><g><g><rect x="620" y="216" width="550" height="91" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="243">金融と暗号資産</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="265">日本：FISC 安全対策基準 第 14 版、金融庁ガイドライン</text><text x="630" y="279">米国：GLBA Safeguards Rule、NYDFS 23 NYCRR 500</text><text x="630" y="293">ベトナム：通達 09/2020、50/2024、暗号資産の保管</text></g></g></g><g><g><rect x="620" y="319" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="346">EC</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="368">日本：クレジットカード・セキュリティガイドライン 6.1</text><text x="630" y="382">ベトナム：電子商取引法 122/2025、政令 248/2026</text></g></g></g><g><g><rect x="620" y="405" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="432">公共</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="454">日本：政府統一基準群、ISMAP、サイバー対処能力強化法</text><text x="630" y="468">ベトナム：政令 85/2016、法律 116/2025</text></g></g></g><g><g><rect x="620" y="491" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="518">教育</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="540">日本：教育情報セキュリティポリシーガイドライン</text><text x="630" y="554">米国：FERPA、COPPA</text></g></g></g><g><g><rect x="620" y="577" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="604">IoT・OT・車両</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="626">日本：JC-STAR、EU：ETSI EN 303 645、EU CRA</text><text x="630" y="640">IEC 62443、UN R155 / R156</text></g></g></g><g><g><rect x="30" y="738" width="1140" height="99" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="40" y="765">業種の検出</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="40" y="787">detect_stack は依存関係と識別子から 9 つの業種シグナル（medical、finance、crypto、ecommerce、government、</text><text x="40" y="801">education、iot、ot、automotive）を検出し、6 つのモジュールに対応付けます。ユーザーが申告した業種はコードに現れなくても</text><text x="40" y="815">追加し、業種を検出したときは法域（GDPR、個人情報保護法、ベトナム PDPL、米国）を確認します。</text></g></g></g></g></g></g></svg>
