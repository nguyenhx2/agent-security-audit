<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="822" viewBox="0 0 1262 822" role="img" aria-labelledby="scanner-update-flow-title scanner-update-flow-desc"><title id="scanner-update-flow-title">Scanner updates: on a schedule, proven, reviewed</title><desc id="scanner-update-flow-desc">Flow of the weekly scanner pin update. Every Monday at 02:17 UTC, or on a manual run, the update-pins workflow runs update_pins.py --check, which asks Docker Hub and GHCR anonymously for each scanner's newest stable tag and the digest of its multi-arch image index; a tag is proposed only after it has been public for 7 days, and never as a downgrade. Exit 0 means every pin is current and the run ends quietly. Otherwise smoke_scanners.py runs each candidate image on a fixture with one planted defect per scanner, eight scanners, and the image must still find it; this job holds only a read token, so new images never see the write token. update_pins.py --write then moves the pins in both editions and the gates run: both selftests, the offline eval, edition parity, plugin manifests, numbers and versions. The result is one pull request from bot/scanner-pins, labelled scanner-pins, with release-notes links, a draft CHANGELOG entry and the smoke-test table; CI runs on three operating systems. A maintainer reviews and merges it by hand, it is never auto-merged, and a z release ships the new pins. If the lookup, the smoke test, a gate or the pull request step fails, one issue "update-pins failed" is opened, later failures comment on it, and the next successful run closes it. During an audit the pins never move: images are fixed by digest and the Phase 8 re-scan uses the same rules; run_scanners.py --check-updates only reports newer versions, never pulls or changes a pin, and --pin tries one version on purpose.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1260" height="820" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">Scanner updates: on a schedule, proven, reviewed</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">Safe and current at once: the pins are checked every week, and a new version moves only after a cooldown, a smoke test and a human review.</text></g></g></g><g><g><rect x="30" y="110" width="200" height="110" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="40" y="137">Trigger</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="159">weekly, Monday 02:17 UTC</text><text x="40" y="173">or a manual run</text><text x="40" y="187">from another branch:</text><text x="40" y="201">a dry run, no PR</text></g></g></g><g><g><rect x="270" y="110" width="280" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="280" y="137">update_pins.py --check</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="280" y="159">newest stable tag per scanner</text><text x="280" y="173">and its multi-arch index digest</text><text x="280" y="187">public 7 days first (cooldown)</text><text x="280" y="201">never a downgrade</text><text x="280" y="215">no rc, beta or latest tags</text><text x="280" y="229">exit 10: updates to propose</text></g></g></g><g><g><rect x="590" y="110" width="300" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="137">smoke_scanners.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="600" y="159">each candidate image runs on a</text><text x="600" y="173">fixture with one planted defect</text><text x="600" y="187">per scanner (8 scanners) and</text><text x="600" y="201">must still find it</text><text x="600" y="215">read-only job: new images</text><text x="600" y="229">never see the write token</text></g></g></g><g><g><rect x="930" y="110" width="300" height="150" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="940" y="137">update_pins.py --write + gates</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="940" y="159">pins move in both editions,</text><text x="940" y="173">READMEs and install hints</text><text x="940" y="187">gates: both selftests, eval,</text><text x="940" y="201">edition parity, plugin manifests,</text><text x="940" y="215">numbers, versions</text></g></g></g><g><g><rect x="30" y="300" width="200" height="140" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="40" y="327">Exit 0: all current</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="349">the run ends green</text><text x="40" y="363">and quiet, nothing</text><text x="40" y="377">else runs</text></g></g></g><g><g><rect x="270" y="300" width="230" height="140" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="280" y="327">Docker Hub, GHCR</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="280" y="349">anonymous Registry API v2</text><text x="280" y="363">GitHub releases: notes, dates</text><text x="280" y="377">every reply is untrusted,</text><text x="280" y="391">matched to strict patterns</text></g></g></g><g><g><rect x="590" y="300" width="300" height="140" rx="5" ry="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" style="fill: rgb(254, 226, 226); stroke: rgb(185, 28, 28);"/></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(127, 29, 29);"><text x="600" y="327">Issue "update-pins failed"</text></g></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(127, 29, 29);"><text x="600" y="349">lookup, smoke test, gate or PR</text><text x="600" y="363">failed: one issue, label scanner-pins</text><text x="600" y="377">later failures comment on it</text><text x="600" y="391">the next success closes it</text><text x="600" y="405">nothing is merged</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="270" y="480" width="280" height="140" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2.5" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="280" y="507">z release</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="280" y="529">version bump, CHANGELOG in</text><text x="280" y="543">both editions from the draft</text><text x="280" y="557">merged pins reach users</text><text x="280" y="571">only with this release</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="590" y="480" width="300" height="140" rx="5" ry="5" fill="#f1f5f9" stroke="#475569" stroke-width="2.5" style="fill: rgb(241, 245, 249); stroke: rgb(71, 85, 105);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="507">A maintainer reviews</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="600" y="529">reads the release notes</text><text x="600" y="543">and the smoke test table</text><text x="600" y="557">merges by hand</text></g></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="600" y="606">never auto-merged</text></g></g></g><g><g><rect x="930" y="480" width="300" height="140" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="940" y="507">One pull request</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="940" y="529">branch bot/scanner-pins</text><text x="940" y="543">label scanner-pins</text><text x="940" y="557">release notes links, draft</text><text x="940" y="571">CHANGELOG, smoke test table</text><text x="940" y="585">CI on 3 operating systems</text></g></g></g><g><g><rect x="30" y="660" width="1200" height="130" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="45" y="687">During an audit: the pins never move on their own</text></g></g></g><g><g><rect x="45" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="55" y="725">Pinned by digest</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="55" y="747">tag + sha256 digest; the Phase 8</text><text x="55" y="761">re-scan runs the same rules</text></g></g></g><g><g><rect x="440" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="450" y="725">run_scanners.py --check-updates</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="450" y="747">only reports newer versions:</text><text x="450" y="761">never pulls, never changes a pin</text></g></g></g><g><g><rect x="835" y="698" width="380" height="78" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="845" y="725">--pin tool=image:tag@sha256:...</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="845" y="747">tries one version on purpose,</text><text x="845" y="761">for that run only</text></g></g></g><g><g><path d="M 230 165 L 258.76 165" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 267.76 165 L 258.76 169.5 L 258.76 160.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 550 185 L 578.76 185" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 587.76 185 L 578.76 189.5 L 578.76 180.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 890 185 L 918.76 185" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 927.76 185 L 918.76 189.5 L 918.76 180.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 385 300 L 385 271.24" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 385 262.24 L 389.5 271.24 L 380.5 271