<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="702" viewBox="0 0 1262 702" role="img" aria-labelledby="threat-intel-flow-title threat-intel-flow-desc"><title id="threat-intel-flow-title">ライブ脅威情報：リポジトリがデプロイするものを、当日の脆弱性情報と照合</title><desc id="threat-intel-flow-desc">ライブ脅威情報の流れ。監査対象リポジトリのバージョン指定（Dockerfile、compose、Kubernetes と Helm、バージョンファイル、CI のセットアップ手順、サーバーレスのランタイム、フレームワークのロックファイル）を platform_inventory.py がネットワークを使わずに読み、各コンポーネントのバージョン、精度、文脈、露出のシグナルを platform.json に記録する。threat_intel.py はバックグラウンドで、この一覧を海外のフィード（CISA KEV、NVD CVE API 2.0、FIRST EPSS、endoflife.date）と国内のフィード（IPA、JPCERT/CC、JVN、JVN iPedia）に照合し、送信するのは製品名とバージョンだけである。取得に失敗した、または停止中のフィードは報告書に未確認範囲として明記し、合格扱いにはしない。結果の intel.json と intel.md は、コンポーネントを act-now、review、update に分類する。supply-chain-infra レーン（Quick ではリード）が重大度の下限に従って判定し、報告書の第 2 章にプラットフォームのバージョン、勧告 ID、フィードの日付、未取得のフィードを載せる。悪用が確認された CVE がどの指摘にも含まれない場合、検証スクリプトが警告する。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1260" height="700" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">ライブ脅威情報：リポジトリがデプロイするものを、当日の脆弱性情報と照合</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">インシデント名を指定する必要はありません。監査のたびに、見つけたバージョンを国内外の公開フィードと照合します。</text></g></g></g><g><g><rect x="30" y="110" width="240" height="170" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="137">監査対象リポジトリ</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="159">Dockerfile の FROM、ARG 既定値</text><text x="40" y="173">compose、Kubernetes、Helm</text><text x="40" y="187">.tool-versions、.nvmrc など</text><text x="40" y="201">CI のセットアップ手順</text><text x="40" y="215">サーバーレスのランタイム</text><text x="40" y="229">フレームワークのロックファイル</text></g></g></g><g><g><rect x="320" y="110" width="270" height="170" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="330" y="137">platform_inventory.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="330" y="159">ネットワークなし、数秒、platform.json</text><text x="330" y="173">バージョンと指定箇所の path:line</text><text x="330" y="187">精度：exact、minor、range、</text><text x="330" y="201">floating、distro、managed</text><text x="330" y="215">文脈：deploy、build、ci、dev</text><text x="330" y="229">露出とハードニングのシグナル</text></g></g></g><g><g transform="translate(0.5,0.5)"><rect x="640" y="110" width="270" height="170" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2.5" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="650" y="137">threat_intel.py</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="650" y="159">バックグラウンド、10-90 秒</text><text x="650" y="173">送信は製品名とバージョンのみ</text><text x="650" y="187">接続先は固定の許可リスト</text><text x="650" y="201">フィードごとに TTL でキャッシュ</text><text x="650" y="215">フィードの文章は無害化し、</text><text x="650" y="229">データとして扱う（指示ではない）</text></g></g></g><g><g><rect x="970" y="96" width="260" height="130" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="980" y="123">海外のフィード</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="980" y="145">CISA KEV（悪用、ランサムウェア）</text><text x="980" y="159">NVD CVE API 2.0（CPE + 版）</text><text x="980" y="173">FIRST EPSS（30 日の悪用確率）</text><text x="980" y="187">endoflife.date（サポート期間）</text></g></g></g><g><g><rect x="970" y="246" width="260" height="130" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="980" y="273">国内のフィード</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="980" y="295">IPA 重要なセキュリティ情報</text><text x="980" y="309">JPCERT/CC 注意喚起</text><text x="980" y="323">JVN（JVN#、JVNVU#）</text><text x="980" y="337">JVN iPedia 新着</text></g></g></g><g><g><rect x="970" y="440" width="260" height="130" rx="5" ry="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" style="fill: rgb(254, 226, 226); stroke: rgb(185, 28, 28);"/></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(127, 29, 29);"><text x="980" y="467">フィードの失敗・停止</text></g></g></g><g><g></g><g><g fill="#7F1D1D" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(127, 29, 29);"><text x="980" y="489">報告書に未確認範囲として</text><text x="980" y="503">明記し、合格扱いにしない</text><text x="980" y="517">--offline：キャッシュのみ。</text><text x="980" y="531">これも明記する</text></g></g></g><g><g><rect x="640" y="440" width="270" height="130" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="650" y="467">intel.json + intel.md</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="650" y="489">act-now：固定版に KEV または</text><text x="650" y="503">国内注意喚起の CVE</text><text x="650" y="517">review：EOL、版未確認の注意喚起、重大</text><text x="650" y="531">update：最新パッチより古い</text></g></g></g><g><g><rect x="320" y="440" width="270" height="130" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="330" y="467">トリアージ（supply-chain-infra）</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="330" y="489">Quick ではリードが担当</text><text x="330" y="503">重大度の下限：インターネットに</text><text x="330" y="517">面した exact 指定に KEV = P0/P1</text><text x="330" y="531">是正策ごとに 1 件：</text><text x="330" y="545">更新、再ビルド、再デプロイ</text></g></g></g><g><g><rect x="30" y="440" width="240" height="130" rx="5" ry="5" fill="#ffffff" stroke="#16365c" stroke-width="2" style="fill: rgb(255, 255, 255); stroke: rgb(22, 54, 92);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="467">報告書 第 2 章</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="489">プラットフォームのバージョンと</text><text x="40" y="503">脅威情報、勧告 ID、</text><text x="40" y="517">フィードの日付と未取得分</text><text x="40" y="531">KEV の CVE が指摘にない</text><text x="40" y="545">ときは検証で警告</text></g></g></g><g><g><path d="M 270 195 L 308.76 195" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 317.76 195 L 308.76 199.5 L 308.76 190.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 590 195 L 628.76 195" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 637.76 195 L 628.76 199.5 L 628.76 190.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 970 161 L 950 161 Q 940 161 940 156.75 L 940 154.63 Q 940 152.5 930.62 152.5 L 921.24 152.5" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 912.24 152.5 L 921.24 148 L 921.24 157 Z" fill="#b45309" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g><g><path d="M 970 311 L 950 311 Q 940 311 940 301 L 940 256 Q 940 246 930.62 246 L 921.24 246" fill="none" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(180, 83, 9);"/><path d="M 912.24 246 L 921.24 241.5 L 921.24 250.5 Z" fill="#b45309" stroke="#b45309" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(180, 83, 9); stroke: rgb(180, 83, 9);"/></g></g><g><g><path d="M 1100 376 L 1100 428.76" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 1100 437.76 L 1095.5 428.76 L 1104.5 428.76 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(51, 65, 85);"><rect fill="#F8FAFC" stroke="none" x="1076" y="402" width="50" height="15" stroke-width="0" style="fill: rgb(248, 250, 252);"/><text x="1100" y="413">取得失敗</text></g></g></g><g><g><path d="M 970 505 L 921.24 505" fill="none" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" style="stroke: rgb(185, 28, 28);"/><path d="M 912.24 505 L 921.24 500.5 L 921.24 509.5 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(185, 28, 28); stroke: rgb(185, 28, 28);"/></g></g><g><g><path d="M 775 280 L 775 428.76" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 775 437.76 L 770.5 428.76 L 779.5 428.76 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 640 505 L 601.24 505" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 592.24 505 L 601.24 500.5 L 601.24 509.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g><path d="M 320 505 L 281.24 505" fill="none" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="stroke: rgb(71, 85, 105);"/><path d="M 272.24 505 L 281.24 500.5 L 281.24 509.5 Z" fill="#475569" stroke="#475569" stroke-width="2" stroke-miterlimit="10" style="fill: rgb(71, 85, 105); stroke: rgb(71, 85, 105);"/></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: rgb(71, 85, 105);"><text x="30" y="617">照合の意味は精度で決まります。exact のデプロイ指定は根拠になり、floating タグ（php:8.3-fpm、node:20）は最後にビルドした版、</text><text x="30" y="633">distro パッケージはバックポートの可能性があるため実環境での確認が必要、managed ランタイムは提供者が更新します。</text><text x="30" y="649">脆弱性情報は日々変わるため、報告書にはフィードの日付を記し、その日時点の内容として扱います。</text></g></g></g></g></g></g></svg>
