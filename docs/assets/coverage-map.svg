<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="863" viewBox="0 0 1202 863" role="img" aria-labelledby="coverage-map-title coverage-map-desc"><title id="coverage-map-title">What it checks: technical domains and industry sectors</title><desc id="coverage-map-desc">Coverage map. Left, seven technical domains with their versioned standards: web and API (OWASP Top 10:2025, ASVS 5.0.0, API Security Top 10 2023, CWE Top 25 2025, IPA How to Secure Your Web Site); mobile (MASVS 2.1.0, MASTG 2.0.0, Mobile Top 10 2024); cloud and IaC (CIS AWS, Azure, GCP, Kubernetes, Docker; OWASP Kubernetes Top 10 2025); CI/CD and supply chain (OWASP CI/CD Top 10, SLSA v1.2, SSDF v1.1, Non-Human Identities Top 10 2025, live advisories); AI, LLM, agents and MCP (LLM Top 10 2026, Agentic Top 10 2026, MCP Top 10 beta, AISVS 1.01) and AI coding-agent configs; sensitive data at rest and payments (PCI DSS v4.0.1); privacy (GDPR, Japan APPI, Vietnam PDPL, CCPA, HIPAA, EU CRA, EU AI Act). Right, six industry sector modules with Japanese, US, EU and Vietnamese rules: medical, finance and crypto assets, e-commerce, public sector, education, and IoT, OT and vehicles. Bottom: nine sector signals detected from code map to six modules, and a sector the user states is added even when the code does not show it.</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="861" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">What it checks: technical domains and industry sectors</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">Modules load from what the code shows, plus what the user says. Each cites standard + version + requirement id.</text></g></g></g><g><g></g><g><g fill="#16365C" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(22, 54, 92);"><text x="30" y="118">Technical domains</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(120, 53, 15);"><text x="620" y="118">Industry sectors (JP, US, EU, VN rules)</text></g></g></g><g><g><rect x="30" y="130" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="157">Web and API</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="179">OWASP Top 10:2025, ASVS 5.0.0, API Security Top 10 2023,</text><text x="40" y="193">CWE Top 25 2025, IPA How to Secure Your Web Site (7th)</text></g></g></g><g><g><rect x="30" y="216" width="560" height="57" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="243">Mobile</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="265">OWASP MASVS 2.1.0, MASTG 2.0.0, Mobile Top 10 2024</text></g></g></g><g><g><rect x="30" y="285" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="312">Cloud and IaC</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="334">CIS AWS v7.1.0, Azure v6.0.0, GCP v5.0.0, Kubernetes, Docker;</text><text x="40" y="348">OWASP Kubernetes Top 10 2025; exposure and blast radius</text></g></g></g><g><g><rect x="30" y="371" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="398">CI/CD and supply chain</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="420">OWASP Top 10 CI/CD Security Risks, SLSA v1.2, SSDF v1.1,</text><text x="40" y="434">Non-Human Identities Top 10 2025; runtimes vs live advisories</text></g></g></g><g><g><rect x="30" y="457" width="560" height="91" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="484">AI, LLM, agents, MCP</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="506">LLM Top 10 2026, Agentic Top 10 2026, MCP Top 10 (beta),</text><text x="40" y="520">AISVS 1.01; AI coding-agent configs: Claude Code, Cursor,</text><text x="40" y="534">Copilot, Codex, Gemini and more (permissions, hooks, MCP)</text></g></g></g><g><g><rect x="30" y="560" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="587">Sensitive data at rest, payments</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="609">PCI DSS v4.0.1; never-store vs must-be-unreadable;</text><text x="40" y="623">card, PII and secrets in code, logs, dumps, notebooks</text></g></g></g><g><g><rect x="30" y="646" width="560" height="74" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="673">Privacy</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="695">GDPR, Japan APPI and My Number Act, Vietnam PDPL,</text><text x="40" y="709">CCPA, HIPAA, EU CRA, EU AI Act</text></g></g></g><g><g><rect x="620" y="130" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="157">Medical</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="179">JP: MHLW guidelines 7.0, MIC/METI guidelines 2.0</text><text x="630" y="193">US: HIPAA · EU: GDPR Art. 9 · VN: PDPL</text></g></g></g><g><g><rect x="620" y="216" width="550" height="91" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="243">Finance and crypto assets</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="265">JP: FISC 14th, FSA cybersecurity guidelines</text><text x="630" y="279">US: GLBA Safeguards, NYDFS 23 NYCRR 500</text><text x="630" y="293">VN: Circulars 09/2020, 50/2024; crypto custody checks</text></g></g></g><g><g><rect x="620" y="319" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="346">E-commerce</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="368">JP: Credit Card Security Guidelines 6.1</text><text x="630" y="382">VN: E-commerce Law 122/2025, Decree 248/2026</text></g></g></g><g><g><rect x="620" y="405" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="432">Public sector</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="454">JP: Government Unified Standards, ISMAP, Active Cyber Defense Act</text><text x="630" y="468">VN: Decree 85/2016, Cybersecurity Law 116/2025</text></g></g></g><g><g><rect x="620" y="491" width="550" height="57" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="518">Education</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="540">JP: MEXT guidelines (2025) · US: FERPA, COPPA</text></g></g></g><g><g><rect x="620" y="560" width="550" height="74" rx="5" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" style="fill: rgb(254, 243, 199); stroke: rgb(180, 83, 9);"/></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(120, 53, 15);"><text x="630" y="587">IoT, OT and vehicles</text></g></g></g><g><g></g><g><g fill="#78350F" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(120, 53, 15);"><text x="630" y="609">JP: JC-STAR · EU: ETSI EN 303 645, EU CRA</text><text x="630" y="623">IEC 62443, UN R155 / R156</text></g></g></g><g><g><rect x="30" y="738" width="1140" height="99" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="40" y="765">Sector detection</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="40" y="787">detect_stack finds 9 sector signals in dependencies and identifiers (medical, finance, crypto, ecommerce,</text><text x="40" y="801">government, education, iot, ot, automotive) and maps them to 6 modules. A sector the user states is added even when</text><text x="40" y="815">the code does not show it, and a detected sector asks for the jurisdiction: GDPR, APPI, Vietnam PDPL or US.</text></g></g></g></g></g></g></svg>
