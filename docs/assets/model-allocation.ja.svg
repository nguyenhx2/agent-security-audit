<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="774" viewBox="0 0 1202 774" role="img" aria-labelledby="model-allocation-title model-allocation-desc"><title id="model-allocation-title">どのモデルが何をするか：深さとサブエージェントごとの割り当て</title><desc id="model-allocation-desc">監査の深さごとのモデル割り当て。列は Quick、Standard、Deep、行は役割。偵察：Quick はリードがインライン、Standard と Deep は recon-mapper サブエージェント（Sonnet、medium）。設計系レーン（authz-logic、sensitive-data、ai-agentic）：Quick はリード、Standard は Sonnet high、Deep は Opus high。その他のレーン（injection-dataflow、mobile、supply-chain-infra、perf-quality）：Quick はリード、Standard は Sonnet medium、Deep は Sonnet high。検証：Quick はリードが P0 と P1 を再確認、Standard は finding-verifier が Sonnet high で P0 と P1、Deep は Opus high で P0 から P2。翻訳（報告書の言語が 2 つ以上のときのみ）：report-translator、Sonnet medium。下段：モデルを使わずに探索を行う決定論的なスクリプトと、すべてのサブエージェントに適用される規則（読み取り専用のツール、ターン上限、CLAUDE.md を読み込まない、Haiku をセキュリティ判断に使わない）。</desc><defs/><g><g><g><g><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="1200" height="772" rx="9" ry="9" fill="#f8fafc" stroke="#cbd5e1" style="fill: rgb(248, 250, 252); stroke: rgb(203, 213, 225);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="22px" style="fill: rgb(11, 31, 51);"><text x="30" y="48">どのモデルが何をするか：深さとサブエージェントごとの割り当て</text></g></g></g><g><g></g><g><g fill="#475569" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(71, 85, 105);"><text x="30" y="76">探索はスクリプトが行うため、モデルのターンは判断に使います。呼び出しごとにモデルと effort を明示します。</text></g></g></g><g><g><rect x="30" y="100" width="270" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" style="fill: rgb(22, 54, 92); stroke: rgb(22, 54, 92);"/></g><g><g fill="#FFFFFF" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(255, 255, 255);"><text x="165" y="129">役割</text></g></g></g><g><g><rect x="310" y="100" width="280" height="46" rx="5" ry="5" fill="#16365c" stroke="#16365c" stroke-width="1.5" 