ca" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="371">その他のレーン</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="393">injection-dataflow、mobile、</text><text x="40" y="407">supply-chain-infra、perf-quality</text></g></g></g><g><g><rect x="310" y="344" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="371">リード、インライン</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="393">残りは未確認範囲</text><text x="320" y="407">として明記</text></g></g></g><g><g><rect x="600" y="344" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="371">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="393">Sonnet / medium</text><text x="610" y="407">範囲が明確、SAST 主体</text></g></g></g><g><g><rect x="890" y="344" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="900" y="371">lane-reviewer</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="900" y="393">Sonnet / high</text><text x="900" y="407">グループごとに並列</text></g></g></g><g><g><rect x="30" y="438" width="270" height="84" rx="5" ry="5" fill="#ffffff" stroke="#3e5c7a" stroke-width="1.5" style="fill: rgb(255, 255, 255); stroke: rgb(62, 92, 122);"/></g></g><g><g></g><g><g fill="#0B1F33" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(11, 31, 51);"><text x="40" y="465">検証</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="40" y="487">各候補の反証を試みる</text><text x="40" y="501">（最大 100 ターン）</text></g></g></g><g><g><rect x="310" y="438" width="280" height="84" rx="5" ry="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" style="fill: rgb(241, 245, 249); stroke: rgb(148, 163, 184);"/></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(51, 65, 85);"><text x="320" y="465">リードが P0/P1 を再確認</text></g></g></g><g><g></g><g><g fill="#334155" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(51, 65, 85);"><text x="320" y="487">4 つの反証の</text><text x="320" y="501">問いで確認</text></g></g></g><g><g><rect x="600" y="438" width="280" height="84" rx="5" ry="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" style="fill: rgb(204, 251, 241); stroke: rgb(15, 118, 110);"/></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(19, 78, 74);"><text x="610" y="465">finding-verifier</text></g></g></g><g><g></g><g><g fill="#134E4A" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(19, 78, 74);"><text x="610" y="487">Sonnet / high</text><text x="610" y="501">P0 と P1 が対象</text></g></g></g><g><g><rect x="890" y="438" width="280" height="84